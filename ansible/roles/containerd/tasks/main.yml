- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/ubuntu"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [stable]
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    signed_by: "https://download.docker.com/linux/ubuntu/gpg"
    state: present
    install_python_debian: true

- name: Install containerd
  ansible.builtin.apt:
    name: "containerd.io{{ '=' + containerd_version if containerd_version | length > 0 else '' }}"
    state: present
    update_cache: true

- name: Check if containerd config already exists
  ansible.builtin.stat:
    path: /etc/containerd/config.toml
  register: containerd_config_stat

- name: Generate default containerd config
  ansible.builtin.command: containerd config default
  register: containerd_default_config
  changed_when: false
  when: not containerd_config_stat.stat.exists

- name: Write containerd config
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: "{{ containerd_default_config.stdout }}"
    mode: "0644"
  when: not containerd_config_stat.stat.exists
  notify: Restart containerd

- name: Enable SystemdCgroup in containerd config
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^(\s*SystemdCgroup\s*=\s*)false'
    line: '\1true'
    backrefs: true
  notify: Restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
